# Render Blueprint — backend stateful com Docker (ver docs/arquitetura/adr/0009_deploy_stateful.md).
# Deploy: New → Blueprint → aponte para este repo. O front vai na Vercel (ver frontend/vercel.json).
services:
  - type: web
    name: nobrelog-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Domínio do frontend na Vercel (ex.: https://nobrelog.vercel.app). Defina no dashboard.
      - key: CORS_ORIGINS
        sync: false
      # Camada LLM (opcional — sem chave, /insight responde 503 fallback).
      # Provedor: "anthropic" ou "nvidia" (NVIDIA NIM, compatível com OpenAI).
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-haiku-4-5
      # Chave do LLM (Anthropic sk-ant-… OU NVIDIA nvapi-…). Defina no dashboard.
      - key: LLM_API_KEY
        sync: false
      # Compat: se preferir, use ANTHROPIC_API_KEY (o código cai para ela).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Só p/ NVIDIA NIM / OpenAI-compatível:
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: OCUPACAO_MINIMA
        value: "0.6"
      - key: PYTHONUNBUFFERED
        value: "1"
