[project]
name = "nobrelog-backend"
version = "0.1.0"
description = "NobreLOG Optimizer — backend (FastAPI + PuLP + WeasyPrint)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pandas>=2.2",
    "pulp>=2.8",
    "pydantic>=2.6",
    "python-multipart",
    "jinja2",
]

[project.optional-dependencies]
pdf = ["weasyprint>=61"]
llm = ["anthropic"]
dev = ["pytest", "httpx", "ruff", "mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
